[package]
name = "hghubx"
version = "1.3.0"
description = "HGhubX client"
authors = ["HGhubX"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "hghubx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Tauri 2 打 iOS/桌面包时会把 custom-protocol 传给我们这个 crate；
# 少了它 `tauri ios build` 直接报 “does not contain this feature”。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "=2.7.2"
tauri-plugin-clipboard-manager = "=2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
# 注意：system-proxy 必须显式列出。关掉 default-features 会连带丢掉它，
# 客户端就完全不看 Windows 系统代理（注册表 ProxyEnable/ProxyServer）而直连，
# 症状正是「浏览器能开官网、HGhubX 打不开」。见 src/net.rs 顶部说明。
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "system-proxy",
  "socks",
  "gzip",
  "brotli",
  "json",
  "charset",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
aes = "0.8"
base64 = "0.22"
percent-encoding = "2"
once_cell = "1"
url = "2"

# macOS 红绿灯垂直居中需要读取 AppKit 按钮尺寸（见 src/macos_titlebar.rs）。
# 三者均已是 tao/wry 的间接依赖，版本与 Cargo.lock 一致；只开启用到的 feature。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSButton",
  "NSControl",
  "NSGraphics",
  "NSResponder",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-ui-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "UIResponder",
  "UIView",
  "UIScrollView",
  "UIWindow",
  "UIGeometry",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
  "std",
  "WKWebViewConfiguration",
  "WKPreferences",
] }

[target.'cfg(target_os = "windows")'.dependencies]
# 读 HKCU Internet Settings 判断系统代理是否启用（只报 bool，地址交给 reqwest system-proxy）。
winreg = "0.56"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
